name: Publish dist release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build dist
        run: sbt -Dsbt.supershell=false dist

      - name: Name dist asset
        id: dist
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          asset="op-return-bot-dist-${short_sha}.zip"
          mv target/universal/op-return-bot-*.zip "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "tag=build-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.dist.outputs.tag }}" \
            "${{ steps.dist.outputs.asset }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.dist.outputs.tag }}" \
            --notes "Automated dist build for $GITHUB_SHA." \
            --prerelease \
            --latest=false
